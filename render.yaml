services:
  - type: web
    name: q-target
    runtime: node
    branch: main
    buildCommand: npm ci && npx vinext build
    startCommand: npx vinext start --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        sync: false
